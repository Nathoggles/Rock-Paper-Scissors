<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css"> 

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
</head>
<body>
   <div id="border"> 
    <div id="game">
        <div id="aboveimages">
            <h3 id="round">Round <span id=roundCount>1</span> of 5</h3>
            <h3 id="scorehl">Score</h3>
            <h3 id="score">
                <span class="scoreclass" id = you>YOU</span>
                <span class="scoreclass" id = pc>0</span>
                <span class="scoreclass" id = comp>0</span>
                <span class="scoreclass" id = opp>NPC</span>
            </h3>
    </div>

    <!--
    <div id="logo">
        <img src="rps_logo.jpg" alt="A panda and a hare play 'Rock, Paper, Scissors'" height="auto" width="250">
        </div>
    -->
     <div id="images">
        <img src="rps_logo.jpeg" alt="A panda and a hare play 'Rock, Paper, Scissors'" height="auto" width="250">
            <!--<img src="rock_s.jpeg" alt="Rock" height="auto" width="150px">
            <img src="paper_s.jpeg" alt="Paper" height="auto" width="150px"> -->
    </div>
    <div id="belowimages">
        <h3 id="text">Let's play Rock-Paper-Scissors! What do you pick?</h3>
        <div id ="divbuttons">
            <button class = gamebuttons id="rock"><img class="icon" src=icon_ro.jpeg alt="An icon indicating 'Rock'" width="50px" height="auto"></button>
            <button class = gamebuttons id="paper"><img class="icon" src=icon_pa.jpeg alt="An icon indicating 'Paper'" width="50px" height="auto"></button></button>
            <button class = gamebuttons id="scissors"><img class="icon" src=icon_sc.jpeg alt="An icon indicating 'Scissors'" width="50px" height="auto"></button></button>
        </div>
    </div>
</div>
</div>
    <script type="text/javascript" src="rps.js"></script>
</body>
</html>
